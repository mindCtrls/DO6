stages:
       - codestyle
       - build
       - integratedTest
       - deployment

codestyle-job:
  stage: codestyle
  tags: [do6]
  script:
    - cd ./code-samples
    - clang-format -Werror -n *.c

build-job:
  stage: build
  tags: [do6]
  script:
    - cd ./code-samples
    - make all
  artifacts:
    name: "exe_DO"
    expose_as: 'DO executable'
    paths:
      - ./code-samples/DO
    expire_in: 30 days

integratedTest-job:
  stage: integratedTest
  tags: [do6]
  script:
    - cd ./code-samples
    - bash tests.sh
  after_script:
    - bash notify.sh "Этап CD успешно пройден 

deployment-job:
  stage: deployment
  tags: [do6]
  script:
    - cd ./code-samples
    - bash copy.sh
  when: manual
  needs: 
    - codestyle-job
    - build-job
    - integratedTest-job
  after_script:
    - bash notify.sh "Этап CD успешно пройден 